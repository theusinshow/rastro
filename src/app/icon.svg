<!--
  Marca do Rastro: um R cuja perna é a estrada.

  Construída sobre grade de 100, com um peso de traço só na letra inteira. A
  perna sai de dentro da barriga, desce com um único ponto de inflexão e pousa
  na mesma linha de base da haste.

  Sobre placa, a marca ocupa 74% do quadrado. O resto é respiro.

  O traço é 14, e não os 12 do especímen grande: o navegador desenha este
  arquivo em 16 e 32px, e nessa faixa a compensação óptica manda engrossar. Pelo
  mesmo motivo não há faixa central tracejada aqui, cada tracinho mediria menos
  de um pixel e só sujaria o âmbar.

  Cores e raio vêm dos tokens de globals.css (base, ink, accent), repetidos aqui
  como literal porque um favicon não lê variável CSS.

  ATENÇÃO: comentário XML não pode conter dois hifens seguidos. Escrever o nome
  de um token com o prefixo de variável CSS aqui torna o arquivo inválido e o
  navegador para de desenhar o ícone, sem erro visível em lugar nenhum.

  A mesma geometria vive em src/components/ui/Logo.tsx, porque o Next exige um
  arquivo estático para o favicon. Ao mexer aqui, mexa lá.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" rx="26" fill="#1C1712" />
  <g transform="translate(50 50) scale(0.74) translate(-50 -50)">
    <g fill="none" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
      <path d="M30 80 V20 H53 A14 14 0 0 1 53 48 H30" stroke="#F0E4D2" />
      <path d="M45 48 C58 54 51 62 59 67 C64 70 66 73 70 80" stroke="#E0A02E" />
    </g>
  </g>
</svg>
