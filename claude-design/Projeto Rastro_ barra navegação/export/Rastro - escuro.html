document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  html, body { margin: 0; padding: 0; background: #0e0d0c; color: #ede6db;\n    font-family: 'Archivo', system-ui, sans-serif; font-size: 17px; line-height: 1.55;\n    -webkit-font-smoothing: antialiased; text-wrap: pretty; }\n  * { box-sizing: border-box; }\n  button, input, select, textarea { font: inherit; color: inherit; }\n  a { color: #e5a338; text-decoration-color: rgba(229,163,56,.4); text-underline-offset: 3px; }\n  a:hover { color: #f2bc5e; }\n  ::selection { background: #6d4d13; color: #ede6db; }\n  :focus-visible { outline: 2px solid #e5a338; outline-offset: 3px; border-radius: 4px; }\n  ::-webkit-scrollbar { width: 10px; height: 10px; }\n  ::-webkit-scrollbar-thumb { background: rgba(237,230,219,.14); border-radius: 999px; border: 3px solid transparent; background-clip: padding-box; }\n  ::-webkit-scrollbar-track { background: transparent; }\n\n  .rastro-tiles { filter: grayscale(1) invert(1) brightness(.52) contrast(1.5) sepia(.62) hue-rotate(-12deg) saturate(1.35); }\n  .leaflet-container { background: #0d0d0c !important; font-family: 'JetBrains Mono', monospace !important; }\n  .leaflet-control-attribution { background: rgba(14,13,12,.72) !important; color: #9b9082 !important;\n    font-size: 10px !important; letter-spacing: .04em; padding: 2px 8px !important; border-radius: 999px 0 0 0; }\n  .leaflet-control-attribution a { color: #bcb2a4 !important; }\n  .rastro-pin { background: none !important; border: 0 !important; }\n  .rp { transition: transform 140ms cubic-bezier(.25,1,.5,1); transform-origin: 50% 50%; cursor: pointer; }\n  .rp:hover { transform: scale(1.22); }\n  .rp.is-sel { animation: pinSel 400ms cubic-bezier(.22,1,.36,1); }\n\n  @keyframes pinSel { from { transform: scale(.7); } to { transform: scale(1); } }\n  @keyframes panelIn { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: none; } }\n  @keyframes panelInRight { from { opacity: 0; transform: translateX(12px); } to { opacity: 1; transform: none; } }\n  @keyframes riseIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }\n  @keyframes drawIn { from { stroke-dashoffset: var(--len, 90); } to { stroke-dashoffset: 0; } }\n  @keyframes ruleIn { from { transform: scaleX(0); } to { transform: scaleX(1); } }\n  @keyframes valueFlash { 0% { color: #e5a338; } 100% { color: #ede6db; } }\n  @keyframes dashRoll { to { background-position-x: -20px; } }\n  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }\n\n  /* Barra: a faixa 768–1040px é laptop comum e não cabe com tudo aberto.\n     Nenhum rótulo de destino cai — o que cede é a assinatura (a marca fica, o\n     wordmark sai) e o rótulo da ação, que vira só o \"+\", exatamente como já\n     está previsto para 390px. Ponto de corte medido, não estimado: com tudo\n     aberto a barra soma 1057px. */\n  @media (max-width: 1200px) {\n    [data-bar=\"top\"] { gap: 14px !important; padding-right: 8px !important; }\n    [data-bar=\"wordmark\"] { display: none !important; }\n    [data-bar=\"cta-label\"] { display: none !important; }\n    [data-bar=\"cta\"] { padding: 0 13px !important; }\n  }\n  @media (max-width: 1000px) { [data-bar=\"sistema\"] { display: none !important; } }\n\n  @media (prefers-reduced-motion: reduce) {\n    /* zerado: deslocamento, fade decorativo, stagger, press */\n    [data-motion=\"decor\"], [data-motion=\"decor\"] * { animation: none !important; transition: none !important; transform: none !important; }\n    .rp:hover { transform: none; }\n    /* preservado: sinal de valor e crossfade dos pins carregam informação */\n    [data-motion=\"signal\"] { animation-duration: 400ms !important; }\n  }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"position:fixed;inset:0;overflow:hidden;background:#0e0d0c\">\n\n  <x-import component-from-global-scope=\"rastro-map\" from=\"7db8d39d-6af1-4ea9-9d24-6acab27738c6#/rastro-map.js\" data=\"{{ mapData }}\" hint-size=\"100%,100%\" style=\"position:absolute;inset:0;z-index:0\"><\u002Fx-import>\n\n  <sc-if value=\"{{ isSistema }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:absolute;inset:0;z-index:35;background:#0e0d0c;overflow-y:auto\" data-screen-label=\"Sistema\">\n      <div style=\"max-width:1160px;margin:0 auto;padding:96px 40px 120px;display:flex;flex-direction:column;gap:88px\">\n\n        <div style=\"display:flex;flex-direction:column;gap:20px\">\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1;text-transform:uppercase;letter-spacing:.16em;color:#9b9082\">Rastro · direção visual · 31.07.2026<\u002Fspan>\n          <h1 style=\"margin:0;font-family:'Archivo';font-variation-settings:'wdth' 125;font-weight:700;font-size:32px;line-height:1.05;text-transform:uppercase;letter-spacing:.02em;color:#ede6db;max-width:20ch\">A régua<\u002Fh1>\n          <p style=\"margin:0;max-width:62ch;font-size:20px;line-height:1.45;color:#bcb2a4\">O couro fica, o âmbar fica, o mapa continua sangrando por baixo de tudo. O que muda é que o produto passa a ter <strong style=\"color:#ede6db;font-weight:700\">uma marca gráfica única para dizer de onde veio cada número<\u002Fstrong> — e ela é a faixa central da estrada, que já era a marca.<\u002Fp>\n        <\u002Fdiv>\n\n        <section style=\"display:flex;flex-direction:column;gap:24px\">\n          <div style=\"display:flex;align-items:baseline;gap:16px\">\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.16em;color:#e5a338\">01<\u002Fspan>\n            <h2 style=\"margin:0;font-family:'Archivo';font-variation-settings:'wdth' 115;font-weight:700;font-size:24px;line-height:1.2;color:#ede6db\">Medido, estimado, opinião<\u002Fh2>\n            <span style=\"flex:1;height:1px;background:rgba(237,230,219,.10)\"><\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"margin:0;max-width:70ch;font-size:17px;line-height:1.55;color:#bcb2a4\">Todo valor do produto se apoia numa régua de 2px. <strong style=\"color:#ede6db;font-weight:700\">A régua diz de onde o número veio, antes de você ler a legenda.<\u002Fstrong> Sólida e âmbar: nós medimos. Tracejada e areia: é conta, e o valor vem com <span style=\"font-family:'JetBrains Mono',monospace\">~<\u002Fspan>. Pontilhada e apagada: não sabemos, e o valor é um travessão. Opinião não recebe régua nenhuma — troca de tipo, sai do mono e vira sans com filete à esquerda. Quatro origens, quatro formas, nenhuma palavra necessária.<\u002Fp>\n          <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:16px\">\n            <div style=\"display:flex;flex-direction:column;gap:8px;padding:20px;background:#191817;border:1px solid rgba(237,230,219,.10);border-radius:14px\">\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1;text-transform:uppercase;letter-spacing:.16em;color:#9b9082\">Ponto alto<\u002Fspan>\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:24px;line-height:1;font-variant-numeric:tabular-nums;color:#ede6db\">1822<\u002Fspan>\n              <span style=\"display:block;width:100%;height:2px;background:#e5a338\"><\u002Fspan>\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#9b9082\">metros · medido<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:8px;padding:20px;background:#191817;border:1px solid rgba(237,230,219,.10);border-radius:14px\">\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1;text-transform:uppercase;letter-spacing:.16em;color:#9b9082\">Distância<\u002Fspan>\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:24px;line-height:1;font-variant-numeric:tabular-nums;color:#ede6db\">~ 172<\u002Fspan>\n              <span style=\"display:block;width:100%;height:2px;background-image:repeating-linear-gradient(90deg,#9b9082 0 5px,transparent 5px 10px)\"><\u002Fspan>\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#9b9082\">km · linha reta<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:8px;padding:20px;background:#191817;border:1px solid rgba(237,230,219,.10);border-radius:14px\">\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1;text-transform:uppercase;letter-spacing:.16em;color:#9b9082\">Piso do acesso<\u002Fspan>\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:24px;line-height:1;color:#9b9082\">—<\u002Fspan>\n              <span style=\"display:block;width:100%;height:2px;background-image:repeating-linear-gradient(90deg,rgba(237,230,219,.22) 0 2px,transparent 2px 6px)\"><\u002Fspan>\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#9b9082\">não sabemos<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:8px;padding:20px;background:#191817;border:1px solid rgba(237,230,219,.10);border-radius:14px\">\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1;text-transform:uppercase;letter-spacing:.16em;color:#9b9082\">Do dono<\u002Fspan>\n              <p style=\"margin:0;padding-left:14px;border-left:2px solid rgba(237,230,219,.20);font-size:17px;line-height:1.45;color:#bcb2a4\">Subimos com a serra limpa. Dia de sorte.<\u002Fp>\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#9b9082\">sem régua · opinião<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"margin:0;max-width:70ch;font-size:15px;line-height:1.5;color:#9b9082\">Por que a estrada e não um ícone: a faixa central tracejada já é a marca, já é o traçado da viagem no mapa e já significa asfalto interrompido. Interrompido é exatamente o que um número estimado é. Sobrevive à luva porque é geometria de 2px de altura por 48 de largura, não um glifo de 12px.<\u002Fp>\n        <\u002Fsection>\n\n        <section style=\"display:flex;flex-direction:column;gap:24px\">\n          <div style=\"display:flex;align-items:baseline;gap:16px\">\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.16em;color:#e5a338\">02<\u002Fspan>\n            <h2 style=\"margin:0;font-family:'Archivo';font-variation-settings:'wdth' 115;font-weight:700;font-size:24px;line-height:1.2;color:#ede6db\">Paleta, as duas metades<\u002Fh2>\n            <span style=\"flex:1;height:1px;background:rgba(237,230,219,.10)\"><\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"margin:0;max-width:70ch;font-size:17px;line-height:1.55;color:#bcb2a4\">Mesma família: couro escurecido na superfície, areia no texto, âmbar de instrumento no acento, oliva em visitado. Reafinada — a superfície esquentou um grau, o âmbar subiu um passo em direção ao farol, o alerta ficou mais terracota. Razões medidas sobre <span style=\"font-family:'JetBrains Mono',monospace\">--color-base<\u002Fspan>. O pior caso do sistema é sobre <span style=\"font-family:'JetBrains Mono',monospace\">--color-overlay<\u002Fspan>, onde nenhum par cai abaixo de 4,5.<\u002Fp>\n\n          <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:16px\">\n            <sc-for list=\"{{ surfaceTokens }}\" as=\"t\" hint-placeholder-count=\"4\">\n              <div style=\"display:flex;flex-direction:column;gap:8px\">\n                <span style=\"{{ t.chipStyle }}\"><\u002Fspan>\n                <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.06em;color:#ede6db\">{{ t.name }}<\u002Fspan>\n                <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.06em;color:#9b9082\">{{ t.hex }}<\u002Fspan>\n                <span style=\"font-size:15px;line-height:1.35;color:#9b9082\">{{ t.use }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:16px\">\n            <sc-for list=\"{{ inkTokens }}\" as=\"t\" hint-placeholder-count=\"7\">\n              <div style=\"display:flex;flex-direction:column;gap:8px\">\n                <span style=\"{{ t.chipStyle }}\"><\u002Fspan>\n                <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.06em;color:#ede6db\">{{ t.name }}<\u002Fspan>\n                <span style=\"display:flex;gap:10px;align-items:baseline\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.06em;color:#9b9082\">{{ t.hex }}<\u002Fspan><span style=\"{{ t.ratioStyle }}\">{{ t.ratio }}<\u002Fspan><\u002Fspan>\n                <span style=\"font-size:15px;line-height:1.35;color:#9b9082\">{{ t.use }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;flex-direction:column;gap:12px\">\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1;text-transform:uppercase;letter-spacing:.16em;color:#9b9082\">Dois vocabulários que coincidem em valor e não se unificam<\u002Fspan>\n            <div style=\"display:grid;grid-template-columns:repeat(6,1fr);gap:16px\">\n              <sc-for list=\"{{ stateTokens }}\" as=\"t\" hint-placeholder-count=\"6\">\n                <div style=\"display:flex;flex-direction:column;gap:8px\">\n                  <span style=\"{{ t.chipStyle }}\"><\u002Fspan>\n                  <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.06em;color:#ede6db\">{{ t.name }}<\u002Fspan>\n                  <span style=\"display:flex;gap:10px;align-items:baseline\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#9b9082\">{{ t.hex }}<\u002Fspan><span style=\"{{ t.ratioStyle }}\">{{ t.ratio }}<\u002Fspan><\u002Fspan>\n                  <span style=\"font-size:15px;line-height:1.35;color:#9b9082\">{{ t.use }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;flex-direction:column;gap:12px;padding:24px;background:#191817;border:1px solid rgba(237,230,219,.10);border-radius:20px\">\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1;text-transform:uppercase;letter-spacing:.16em;color:#e5a338\">A outra metade — hex literal do WebGL<\u002Fspan>\n            <p style=\"margin:0;max-width:70ch;font-size:15px;line-height:1.5;color:#9b9082\">Vai em <span style=\"font-family:'JetBrains Mono',monospace\">src/lib/map/style.ts<\u002Fspan> e <span style=\"font-family:'JetBrains Mono',monospace\">src/lib/map/layers.ts<\u002Fspan>. Mudar um lado sem o outro faz interface e mapa divergirem.<\u002Fp>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px 24px;margin-top:8px\">\n              <sc-for list=\"{{ mapHex }}\" as=\"m\" hint-placeholder-count=\"24\">\n                <div style=\"display:flex;align-items:center;gap:10px;min-width:0\">\n                  <span style=\"{{ m.chipStyle }}\"><\u002Fspan>\n                  <span style=\"flex:1;min-width:0;font-size:15px;line-height:1.35;color:#bcb2a4\">{{ m.k }}<\u002Fspan>\n                  <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.04em;color:#9b9082\">{{ m.v }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <section style=\"display:flex;flex-direction:column;gap:24px\">\n          <div style=\"display:flex;align-items:baseline;gap:16px\">\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.16em;color:#e5a338\">03<\u002Fspan>\n            <h2 style=\"margin:0;font-family:'Archivo';font-variation-settings:'wdth' 115;font-weight:700;font-size:24px;line-height:1.2;color:#ede6db\">Tipografia<\u002Fh2>\n            <span style=\"flex:1;height:1px;background:rgba(237,230,219,.10)\"><\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"margin:0;max-width:70ch;font-size:17px;line-height:1.55;color:#bcb2a4\">Archivo e JetBrains Mono ficam, e a escala fica inteira, sem um degrau novo — ela já passou por uma auditoria e passou. Mono não é decoração: <strong style=\"color:#ede6db;font-weight:700\">tudo que é medição está em mono, tudo que é humano está em sans<\u002Fstrong>. É a segunda metade do sistema do §01.<\u002Fp>\n          <div style=\"display:flex;flex-direction:column;border:1px solid rgba(237,230,219,.10);border-radius:20px;overflow:hidden\">\n            <sc-for list=\"{{ typeRows }}\" as=\"r\" hint-placeholder-count=\"6\">\n              <div style=\"display:grid;grid-template-columns:200px 100px 1fr 1.2fr;gap:24px;align-items:center;padding:18px 24px;border-bottom:1px solid rgba(237,230,219,.10)\">\n                <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.06em;color:#e5a338\">{{ r.tk }}<\u002Fspan>\n                <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.06em;color:#9b9082\">{{ r.size }}<\u002Fspan>\n                <span style=\"font-size:15px;color:#9b9082\">{{ r.use }}<\u002Fspan>\n                <span style=\"{{ r.st }}\">{{ r.sample }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px 32px\">\n            <sc-for list=\"{{ charClasses }}\" as=\"c\" hint-placeholder-count=\"7\">\n              <div style=\"display:flex;gap:14px;align-items:baseline\">\n                <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.04em;color:#ede6db;flex:none;min-width:150px\">{{ c.n }}<\u002Fspan>\n                <span style=\"font-size:15px;line-height:1.4;color:#9b9082\">{{ c.s }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <section style=\"display:flex;flex-direction:column;gap:24px\">\n          <div style=\"display:flex;align-items:baseline;gap:16px\">\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.16em;color:#e5a338\">04<\u002Fspan>\n            <h2 style=\"margin:0;font-family:'Archivo';font-variation-settings:'wdth' 115;font-weight:700;font-size:24px;line-height:1.2;color:#ede6db\">Elevação, agora em duas camadas<\u002Fh2>\n            <span style=\"flex:1;height:1px;background:rgba(237,230,219,.10)\"><\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:24px\">\n            <div style=\"display:flex;flex-direction:column;gap:14px;padding:24px;background:#191817;border:1px solid rgba(237,230,219,.10);border-radius:20px;box-shadow:0 18px 40px -24px rgb(0 0 0 / .9)\">\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1;text-transform:uppercase;letter-spacing:.16em;color:#9b9082\">Camada 1 · --shadow-float<\u002Fspan>\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:15px;color:#e5a338\">0 18px 40px -24px rgb(0 0 0 / .9)<\u002Fspan>\n              <p style=\"margin:0;font-size:17px;line-height:1.5;color:#bcb2a4\">Separa cromo do mapa. Papel inalterado: difusão curta, deslocamento negativo grande, um vinco e não um halo.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:14px;padding:24px;background:#221f1d;border:1px solid rgba(237,230,219,.10);border-radius:20px;box-shadow:0 18px 40px -24px rgb(0 0 0 / .9),0 8px 22px -14px rgb(0 0 0 / .85)\">\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1;text-transform:uppercase;letter-spacing:.16em;color:#9b9082\">Camada 2 · --shadow-lift<\u002Fspan>\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:15px;color:#e5a338\">+ 0 8px 22px -14px rgb(0 0 0 / .85)<\u002Fspan>\n              <p style=\"margin:0;font-size:17px;line-height:1.5;color:#bcb2a4\">Some sobre a camada 1, nunca sozinha. Existe porque agora há painel sobre painel: o do lugar abre por cima do FilterRail, e com uma camada só os dois viram uma massa e você perde qual tem o teclado. Quem tem a camada 2 tem o foco.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"margin:0;max-width:70ch;font-size:15px;line-height:1.5;color:#9b9082\">Espaçamento, raio e geometria do cromo permanecem exatamente como estão — 8/12/20/32, raios 8/14/20/28/36/999, barra de 104px abaixo de 768 e 56 acima, folha de 45vh, painéis de 280/380/420.<\u002Fp>\n        <\u002Fsection>\n\n        <section style=\"display:flex;flex-direction:column;gap:24px\">\n          <div style=\"display:flex;align-items:baseline;gap:16px\">\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.16em;color:#e5a338\">05<\u002Fspan>\n            <h2 style=\"margin:0;font-family:'Archivo';font-variation-settings:'wdth' 115;font-weight:700;font-size:24px;line-height:1.2;color:#ede6db\">Movimento<\u002Fh2>\n            <span style=\"flex:1;height:1px;background:rgba(237,230,219,.10)\"><\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"margin:0;max-width:70ch;font-size:17px;line-height:1.55;color:#bcb2a4\">A base fica: um ritmo só, sem bounce, saída a 70% da entrada, deslocamento de 12px. O que entra é uso, não sistema novo — e a política de três camadas continua valendo, com cada peça declarada.<\u002Fp>\n          <div style=\"display:flex;flex-direction:column;border:1px solid rgba(237,230,219,.10);border-radius:20px;overflow:hidden\">\n            <div style=\"display:grid;grid-template-columns:1.6fr .6fr .8fr 1.4fr;gap:24px;padding:14px 24px;background:#191817;border-bottom:1px solid rgba(237,230,219,.10)\">\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#9b9082\">Peça<\u002Fspan>\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#9b9082\">Duração<\u002Fspan>\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#9b9082\">Curva<\u002Fspan>\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#9b9082\">Movimento reduzido<\u002Fspan>\n            <\u002Fdiv>\n            <sc-for list=\"{{ motionRows }}\" as=\"r\" hint-placeholder-count=\"12\">\n              <div style=\"display:grid;grid-template-columns:1.6fr .6fr .8fr 1.4fr;gap:24px;padding:14px 24px;border-bottom:1px solid rgba(237,230,219,.10)\">\n                <span style=\"font-size:17px;color:#ede6db\">{{ r.n }}<\u002Fspan>\n                <span style=\"font-family:'JetBrains Mono',monospace;font-size:15px;font-variant-numeric:tabular-nums;color:#bcb2a4\">{{ r.d }}<\u002Fspan>\n                <span style=\"font-family:'JetBrains Mono',monospace;font-size:15px;color:#bcb2a4\">{{ r.e }}<\u002Fspan>\n                <span style=\"{{ r.cStyle }}\">{{ r.c }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <p style=\"margin:0;max-width:70ch;font-size:15px;line-height:1.5;color:#9b9082\">O morfismo de ícone é sempre informação, nunca enfeite: o glifo do destino ativo redesenha seu próprio traço ao assumir, a bússola do CTA vira o vetor da rota quando a resposta chega. Ambos caem na camada zerada — sob movimento reduzido a forma final aparece de uma vez, e ela sozinha já diz o estado.<\u002Fp>\n        <\u002Fsection>\n\n        <section style=\"display:flex;flex-direction:column;gap:24px\">\n          <div style=\"display:flex;align-items:baseline;gap:16px\">\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.16em;color:#e5a338\">06<\u002Fspan>\n            <h2 style=\"margin:0;font-family:'Archivo';font-variation-settings:'wdth' 115;font-weight:700;font-size:24px;line-height:1.2;color:#ede6db\">A marca<\u002Fh2>\n            <span style=\"flex:1;height:1px;background:rgba(237,230,219,.10)\"><\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:48px;flex-wrap:wrap;padding:32px;background:#191817;border:1px solid rgba(237,230,219,.10);border-radius:20px\">\n            <div style=\"display:flex;flex-direction:column;align-items:center;gap:12px\">\n              <div style=\"width:96px;height:96px;display:flex;align-items:center;justify-content:center;background:#0e0d0c;border:1px solid rgba(237,230,219,.20);border-radius:28px\">\n                <svg width=\"56\" height=\"56\" sc-camel-view-box=\"0 0 32 32\">\n                  <path d=\"M9 27 L9 6 L18.5 6 A6.5 6.5 0 0 1 18.5 19 L12 19\" fill=\"none\" stroke=\"#ede6db\" stroke-width=\"4\" stroke-linecap=\"square\"><\u002Fpath>\n                  <path d=\"M14.5 18.5 L24 27\" fill=\"none\" stroke=\"#ede6db\" stroke-width=\"4.6\"><\u002Fpath>\n                  <path d=\"M15.2 19.4 L23.2 26.6\" fill=\"none\" stroke=\"#0e0d0c\" stroke-width=\"1.3\" stroke-dasharray=\"2.4 2.6\"><\u002Fpath>\n                <\u002Fsvg>\n              <\u002Fdiv>\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.1em;color:#9b9082\">placa · 96px<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;align-items:cen \"4.9\"><\u002Fpath><\u002Fsvg>\n                <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 32 32\"><path d=\"M9 27 L9 6 L18.5 6 A6.5 6.5 0 0 1 18.5 19 L12 19\" fill=\"none\" stroke=\"#ede6db\" stroke-width=\"4.6\" stroke-linecap=\"square\"><\u002Fpath><path d=\"M14.5 18.5 L24 27\" fill=\"none\" stroke=\"#ede6db\" stroke-width=\"5.2\"><\u002Fpath><\u002Fsvg>\n              <\u002Fdiv>\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.1em;color:#9b9082\">32 / 24 / 18 · faixa some abaixo de 32<\u002Fspan>\n            <\u002Fdiv>\n            <p style=\"margin:0;flex:1;min-width:280px;font-size:17px;line-height:1.5;color:#bcb2a4\">A geometria é a mesma, e a compensação óptica de traço por tamanho continua. O que muda é o comportamento: <strong style=\"color:#ede6db;font-weight:700\">na entrada do aplicativo a faixa central desenha uma vez<\u002Fstrong>, 520ms, da junta do R até a ponta da perna — a estrada sendo percorrida. Uma vez por sessão, nunca em laço. Placa só como ícone de app e na tela de entrada; na barra a marca vive sem caixa.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <section style=\"display:flex;flex-direction:column;gap:24px\">\n          <div style=\"display:flex;align-items:baseline;gap:16px\">\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.16em;color:#e5a338\">07<\u002Fspan>\n            <h2 style=\"margin:0;font-family:'Archivo';font-variation-settings:'wdth' 115;font-weight:700;font-size:24px;line-height:1.2;color:#ede6db\">390px, que é onde isto é usado<\u002Fh2>\n            <span style=\"flex:1;height:1px;background:rgba(237,230,219,.10)\"><\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"margin:0;max-width:70ch;font-size:17px;line-height:1.55;color:#bcb2a4\">Nada encolhe. O corpo continua em 17, o rótulo em 12, o alvo em 44. O que muda é a arrumação: a barra vira duas linhas, o painel vira folha infer    <section data-screen-label=\"Explorar\" data-motion=\"decor\" style=\"position:absolute;top:86px;left:12px;bottom:60px;width:380px;z-index:20;display:flex;flex-direction:column;background:rgba(25,24,23,.94);backdrop-filter:blur(16px) saturate(1.1);border:1px solid rgba(237,230,219,.10);border-radius:20px;box-shadow:0 18px 40px -24px rgb(0 0 0 / .9);animation:panelIn 220ms cubic-bezier(.22,1,.36,1);overflow:hidden\">\n\n      <div style=\"padding:20px 20px 12px;display:flex;flex-direction:column;gap:12px\">\n        <div style=\"display:flex;align-items:baseline;justify-content:space-between\">\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1;text-transform:uppercase;letter-spacing:.16em;color:#9b9082\">Explorar<\u002Fspan>\n          <span data-motion=\"signal\" style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.16em;color:#bcb2a4;font-variant-numeric:tabular-nums\">{{ countLabel }}<\u002Fspan>\n        <\u002Fdiv>\n\n        <div style=\"position:relative;display:flex;align-items:center\">\n          <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#9b9082\" stroke-width=\"1.9\" stroke-linecap=\"round\" style=\"position:absolute;left:14px\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"M16.5 16.5 21 21\"><\u002Fpath><\u002Fsvg>\n          <input type=\"text\" value=\"{{ query }}\" sc-camel-on-change=\"{{ onQuery }}\" placeholder=\"Nome, município ou etiqueta\" style=\"width:100%;height:48px;padding:0 16px 0 40px;background:#221f1d;border:1px solid rgba(237,230,219,.10);border-radius:14px;font-size:17px;color:#ede6db;outline:none;transition:border-color 140ms cubic-bezier(.25,1,.5,1)\" style-focus=\"border-color:#e5a338\">\n        <\u002Fdiv>\n\n        <div style=\"display:flex;gap:4px;padding:4px;background:#221f1d;border-radius:999px\">\n          <button type=\"button\" sc-camel-on-click=\"{{ showLista }}\" style=\"{{ tabListaStyle }}\">Lista<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ showFiltros }}\" style=\"{{ tabFiltrosStyle }}\">Filtros<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ railLista }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"flex:1;overflow-y:auto;padding:4px 12px 16px\">\n          <sc-for list=\"{{ visiblePlaces }}\" as=\"p\" hint-placeholder-count=\"6\">\n            <button type=\"button\" sc-camel-on-click=\"{{ p.go }}\" data-motion=\"decor\" style=\"{{ p.rowStyle }}\">\n              <span style=\"{{ p.dotStyle }}\"><\u002Fspan>\n              <span style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;text-align:left\">\n                <span style=\"font-size:17px;line-height:1.25;color:#ede6db;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ p.name }}<\u002Fspan>\n                <span style=\"font-size:15px;line-height:1.3;color:#9b9082;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ p.sub }}<\u002Fspan>\n              <\u002Fspan>\n              <span style=\"display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none\">\n                <span style=\"font-family:'JetBrains Mono',monospace;font-size:15px;letter-spacing:.02em;font-variant-numeric:tabular-nums;color:#bcb2a4\">{{ p.dist }}<\u002Fspan>\n                <span style=\"display:block;width:38px;height:2px;background-image:repeating-linear-gradient(90deg,#9b9082 0 5px,transparent 5px 10px)\"><\u002Fspan>\n              <\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n\n          <sc-if value=\"{{ isEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding:32px 12px;display:flex;flex-direction:column;gap:14px;align-items:flex-start;animation:fadeIn 220ms cubic-bezier(.22,1,.36,1) 120ms both\">\n              <p style=\"margin:0;font-size:17px;color:#bcb2a4\">Nenhum lugar responde a essa busca.<\u002Fp>\n              <button type=\"button\" sc-camel-on-click=\"{{ clearQuery }}\" style=\"height:44px;padding:0 18px;background:none;color:#e5a338;border:1px solid rgba(229,163,56,.45);border-radius:999px;font-size:15px;font-weight:700;cursor:pointer\" style-hover=\"background:rgba(229,163,56,.10)\">{{ clearLabel }}<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ railFiltros }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"flex:1;overflow-y:auto;padding:4px 20px 20px;display:flex;flex-direction:column;gap:32px\" data-motion=\"decor\">\n          <sc-for list=\"{{ filterGroups }}\" as=\"g\" hint-placeholder-count=\"3\">\n            <div style=\"display:flex;flex-direction:column;gap:12px\">\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1;text-transform:uppercase;letter-spacing:.16em;color:#9b9082\">{{ g.title }}<\u002Fspan>\n              <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n                <sc-for list=\"{{ g.chips }}\" as=\"c\" hint-placeholder-count=\"3\">\n                  <button type=\"button\" sc-camel-on-click=\"{{ c.go }}\" style=\"{{ c.style }}\">\n                    <span style=\"{{ c.markStyle }}\"><\u002Fspan>{{ c.label }}\n                  <\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"padding:16px 20px;border-top:1px solid rgba(237,230,219,.10);display:flex;gap:12px\">\n          <button type=\"button\" sc-camel-on-click=\"{{ showLista }}\" style=\"flex:1;height:48px;background:#e5a338;color:#16110b;border:0;border-radius:14px;font-weight:700;font-size:17px;cursor:pointer;transition:background 140ms\" style-hover=\"background:#cf8a1c\">Ver {{ countBare }} lugares<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ clearFilters }}\" style=\"height:48px;padding:0 18px;background:none;color:#bcb2a4;border:1px solid rgba(237,230,219,.20);border-radius:14px;font-size:15px;cursor:pointer\" style-hover=\"color:#ede6db;border-color:rgba(237,230,219,.35)\">Limpar<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <!-- DESCOBRIR -->\n  <sc-if value=\"{{ isDescobrir }}\" hint-placeholder-val=\"{{ false }}\">\n    <section data-screen-label=\"Descobrir\" data-motion=\"decor\" style=\"position:absolute;top:86px;left:12px;bottom:60px;width:380px;z-index:20;display:flex;flex-direction:column;background:rgba(25,24,23,.94);backdrop-filter:blur(16px) saturate(1.1);border:1px solid rgba(237,230,219,.10);border-radius:20px;box-shadow:0 18px 40px -24px rgb(0 0 0 / .9);animation:panelIn 220ms cubic-bezier(.22,1,.36,1);overflow:hidden\">\n      <div style=\"padding:20px 20px 0;display:flex;flex-direction:column;gap:8px\">\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1;text-transform:uppercase;letter-spacing:.16em;color:#9b9082\">Descobrir<\u002Fspan>\n        <p style=\"margin:0;font-size:20px;line-height:1.4;color:#ede6db\">Quanto tempo temos hoje?<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:32px\">\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1;text-transform:uppercase;letter-spacing:.16em;color:#9b9082\">Tempo disponível<\u002Fspan>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:8px\">\n            <sc-for list=\"{{ timeChips }}\" as=\"c\" hint-placeholder-count=\"4\">\n              <button type=\"button\" sc-camel-on-click=\"{{ c.go }}\" style=\"{{ c.style }}\">{{ c.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between\">\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1;text-transform:uppercase;letter-spacing:.16em;color:#9b9082\">Raio a partir da origem<\u002Fspan>\n            <span data-motion=\"signal\" style=\"font-family:'JetBrains Mono',monospace;font-size:15px;font-variant-numeric:tabular-nums;color:#e5a338\">{{ radiusLabel }}<\u002Fspan>\n          <\u002Fdiv>\n          <input type=\"range\" min=\"40\" max=\"400\" step=\"20\" value=\"{{ radius }}\" sc-camel-on-change=\"{{ onRadius }}\" style=\"width:100%;accent-color:#e5a338;height:44px\">\n          <p style=\"margin:0;font-size:15px;color:#9b9082\">Raio em linha reta. A estrada é sempre mais longa.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1;text-transform:uppercase;letter-spacing:.16em;color:#9b9082\">Categorias<\u002Fspan>\n          <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n            <sc-for list=\"{{ catChips }}\" as=\"c\" hint-placeholder-count=\"5\">\n              <button type=\"button\" sc-camel-on-click=\"{{ c.go }}\" style=\"{{ c.style }}\"><span style=\"{{ c.markStyle }}\"><\u002Fspan>{{ c.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ hasDiscovery }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex;flex-direction:column;gap:12px\">\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1;text-transform:uppercase;letter-spacing:.16em;color:#9b9082\">{{ discoveryCount }}<\u002Fspan>\n            <sc-for list=\"{{ discovery }}\" as=\"d\" hint-placeholder-count=\"3\">\n              <button type=\"button\" sc-camel-on-click=\"{{ d.go }}\" data-motion=\"decor\" style=\"display:flex;flex-direction:column;gap:10px;width:100%;text-align:left;padding:16px;background:#221f1d;border:1px solid rgba(237,230,219,.10);border-radius:14px;cursor:pointer;animation:riseIn 220ms cubic-bezier(.22,1,.36,1) both;animation-delay:{{ d.delay }};transition:border-color 140ms,background 140ms\" style-hover=\"background:#2c2926;border-color:rgba(237,230,219,.20)\">\n                <span style=\"display:flex;align-items:baseline;justify-content:space-between;gap:12px\">\n                  <span style=\"font-size:17px;color:#ede6db\">{{ d.name }}<\u002Fspan>\n                  <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.16em;color:{{ d.statusColor }}\">{{ d.status }}<\u002Fspan>\n                <\u002Fspan>\n                <span style=\"display:flex;gap:20px\">\n                  <span style=\"display:flex;flex-direction:column;gap:5px\">\n                    <span style=\"font-family:'JetBrains Mono',monospace;font-size:15px;font-variant-numeric:tabular-nums;color:#bcb2a4\">{{ d.ida }}<\u002Fspan>\n                    <span style=\"display:block;width:52px;height:2px;background-image:repeating-linear-gradient(90deg,#9b9082 0 5px,transparent 5px 10px)\"><\u002Fspan>\n                  <\u002Fspan>\n                  <span style=\"display:flex;flex-direction:column;gap:5px\">\n                    <span style=\"font-family:'JetBrains Mono',monospace;font-size:15px;font-variant-numeric:tabular-nums;color:#bcb2a4\">{{ d.km }}<\u002Fspan>\n                    <span style=\"display:block;width:52px;height:2px;background-image:repeating-linear-gradient(90deg,#9b9082 0 5px,transparent 5px 10px)\"><\u002Fspan>\n                  <\u002Fspan>\n                <\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n            <p style=\"margin:0;font-size:15px;color:#9b9082\">Tempo e distância estimados em linha reta — a régua tracejada diz isso. Medimos a estrada quando virar viagem.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <button type=\"button\" sc-camel-on-click=\"{{ runDiscovery }}\" data-motion=\"decor\" style=\"position:absolute;left:50%;bottom:72px;transform:translateX(-50%);z-index:25;display:flex;align-items:center;gap:14px;height:64px;padding:0 28px;background:#e5a338;color:#16110b;border:0;border-radius:999px;font-family:'Archivo';font-variation-settings:'wdth' 115;font-weight:700;font-size:20px;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;box-shadow:0 18px 40px -24px rgb(0 0 0 / .9),0 8px 22px -14px rgb(0 0 0 / .85);animation:riseIn 320ms cubic-bezier(.22,1,.36,1);transition:background 140ms,transform 90ms\" style-hover=\"background:#cf8a1c\" style-active=\"transform:translateX(-50%) scale(.98)\">\n      <svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"{{ compassPath }}\" style=\"transition:d 320ms cubic-bezier(.22,1,.36,1)\"><\u002Fpath><\u002Fsvg>\n      Para onde vamos?\n    <\u002Fbutton>\n  <\u002Fsc-if>\n\n  <!-- VIAGENS -->\n  <sc-if value=\"{{ isViagens }}\" hint-placeholder-val=\"{{ false }}\">\n    <section data-screen-label=\"Viagens\" data-motion=\"decor\" style=\"position:absolute;top:86px;left:12px;bottom:60px;width:380px;z-index:20;display:flex;flex-direction:column;background:rgba(25,24,23,.94);backdrop-filter:blur(16px) saturate(1.1);border:1px solid rgba(237,230,219,.10);border-radius:20px;box-shadow:0 18px 40px -24px rgb(0 0 0 / .9);animation:panelIn 220ms cubic-bezier(.22,1,.36,1);overflow:hidden\">\n      <div style=\"padding:20px 20px 12px;display:flex;align-items:baseline;justify-content:space-between\">\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1;text-transform:uppercase;letter-spacing:.16em;color:#9b9082\">Viagens<\u002Fspan>\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.16em;color:#bcb2a4\">3 SALVAS<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"flex:1;overflow-y:auto;padding:0 16px 16px;display:flex;flex-direction:column;gap:12px\">\n        <sc-for list=\"{{ trips }}\" as=\"t\" hint-placeholder-count=\"3\">\n          <button type=\"button\" sc-camel-on-click=\"{{ t.go }}\" data-motion=\"decor\" style=\"{{ t.cardStyle }}\">\n            <span style=\"{{ t.edgeStyle }}\"><\u002Fspan>\n            <span style=\"display:flex;flex-direction:column;gap:12px;padding:16px 16px 16px 18px\">\n              <span style=\"display:flex;align-items:baseline;justify-content:space-between;gap:12px\">\n                <span style=\"font-size:17px;line-height:1.25;color:#ede6db;text-align:left\">{{ t.name }}<\u002Fspan>\n                <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.16em;color:#9b9082;flex:none\">{{ t.date }}<\u002Fspan>\n              <\u002Fspan>\n              <span style=\"display:flex;gap:22px\">\n                <span style=\"display:flex;flex-direction:column;gap:5px;align-items:flex-start\">\n                  <span style=\"font-family:'JetBrains Mono',monospace;font-size:20px;line-height:1;font-variant-numeric:tabular-nums;color:#ede6db\">{{ t.km }}<\u002Fspan>\n                  <span style=\"display:block;width:100%;min-width:56px;height:2px;background:#e5a338\"><\u002Fspan>\n                <\u002Fspan>\n                <span style=\"display:flex;flex-direction:column;gap:5px;align-items:flex-start\">\n                  <span style=\"font-family:'JetBrains Mono',monospace;font-size:20px;line-height:1;font-variant-numeric:tabular-nums;color:#ede6db\">{{ t.dur }}<\u002Fspan>\n                  <span style=\"display:block;width:100%;min-width:56px;height:2px;background:#e5a338\"><\u002Fspan>\n                <\u002Fspan>\n                <span style=\"display:flex;flex-direction:column;gap:5px;align-items:flex-start\">\n none\" stroke=\"#d97456\" stroke-width=\"1.9\" stroke-linecap=\"round\" style=\"flex:none;margin-top:2px\"><path d=\"M12 8v5M12 16.5v.01\"><\u002Fpath><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><\u002Fsvg>\n          <p style=\"margin:0;font-size:17px;line-height:1.45;color:#ede6db\">7,4 km de chão entre Urubici e o Morro da Igreja. Depois de chuva, não sabemos como está.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1;text-transform:uppercase;letter-spacing:.16em;color:#9b9082\">Altimetria — medida no traçado<\u002Fspan>\n          <div style=\"padding:16px 16px 12px;background:#221f1d;border:1px solid rgba(237,230,219,.10);border-radius:14px;display:flex;flex-direction:column;gap:12px\">\n            <svg sc-camel-view-box=\"0 0 360 120\" style=\"width:100%;height:120px;display:block\" role=\"img\" aria-label=\"Perfil de altimetria da viagem\">\n              <path d=\"{{ elevArea }}\" fill=\"rgba(229,163,56,.16)\"><\u002Fpath>\n              <path d=\"{{ elevLine }}\" fill=\"none\" stroke=\"#e5a338\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><\u002Fpath>\n              <line x1=\"0\" y1=\"{{ elevMaxY }}\" x2=\"360\" y2=\"{{ elevMaxY }}\" stroke=\"rgba(237,230,219,.20)\" stroke-width=\"1\"><\u002Fline>\n              <line x1=\"0\" y1=\"{{ elevMinY }}\" x2=\"360\" y2=\"{{ elevMinY }}\" stroke=\"rgba(237,230,219,.20)\" stroke-width=\"1\"><\u002Fline>\n            <\u002Fsvg>\n            <div style=\"display:flex;justify-content:space-between\">\n              <sc-for list=\"{{ elevReadings }}\" as=\"r\" hint-placeholder-count=\"3\">\n                <div style=\"display:flex;flex-direction:column;gap:6px;align-items:flex-start\">\n                  <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1;text-transform:uppercase;letter-spacing:.16em;color:#9b908 ton type=\"button\" sc-camel-on-click=\"{{ togglePicker }}\" style=\"height:44px;padding:0 20px;background:#e5a338;color:#16110b;border:0;border-radius:999px;font-weight:700;font-size:15px;cursor:pointer\" style-hover=\"background:#cf8a1c\">Fixar aqui<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}\">\nconst ACCENT = '#e5a338', INK = '#ede6db', MUTED = '#bcb2a4', FAINT = '#9b9082';\nconst RULE_SOLID = 'display:block;width:100%;min-width:48px;height:2px;background:#e5a338';\nconst RULE_DASH = 'display:block;width:100%;min-width:48px;height:2px;background-image:repeating-linear-gradient(90deg,#9b9082 0 5px,transparent 5px 10px)';\nconst RULE_NONE = 'display:block;width:100%;min-width:48px;height:2px;background-image:repeating-linear-gradient(90deg,rgba(237,230,219,.22) 0 2px,transparent 2px 6px)';\n\nconst PLACES = [\n  { id: 'serra', name: 'Serra do Rio do Rastro', mun: 'Lauro Müller', lat: -28.3907, lng: -49.5477, status: 'visited', fav: true, photo: true, tags: ['serra', 'curvas'], dist: 172, alt: 1420 },\n  { id: 'urubici', name: 'Urubici', mun: 'Urubici', lat: -28.0153, lng: -49.5925, status: 'visited', photo: true, tags: ['serra', 'frio'], dist: 154, alt: 980 },\n  { id: 'morro', name: 'Morro da Igreja', mun: 'Urubici', lat: -28.1244, lng: -49.4794, status: 'wanted', fav: true, tags: ['mirante'], dist: 168, alt: 1822 },\n  { id: 'rosa', name: 'Praia do Rosa', mun: 'Imbituba', lat: -28.1264, lng: -48.6408, status: 'visited', photo: true, tags: ['praia'], dist: 92, alt: 12 },\n  { id: 'guarda', name: 'Guarda do Embaú', mun: 'Palhoça', lat: -27.8886, lng: -48.6103, status: 'visited', tags: ['praia'], dist: 51, alt: 6 },\n  { id: 'bombinhas', name: 'Bombinhas', mun: 'Bombinhas', lat: -27.1394, lng: -48.4816, status: 'wanted', tags: ['praia'], dist: 64, alt: 8 },\n  { id: 'pomerode', name: 'Pomerode', mun: 'P
